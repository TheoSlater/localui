# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run
# `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "My Company" # The name of the company
  productName: "My Product" # The name of the application
  productIdentifier: "com.mycompany.myproduct" # The unique product identifier
  description: "A program that does X" # The application description
  copyright: "(c) 2025, My Company" # Copyright text
  comments: "Some Product Comments" # Comments
  version: "0.0.1" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "com.mycompany.myproduct"
#
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "My Product"
#
#   # The app version to embed in Info.plist
#   # (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.0.1"
#
#   # The company/organisation name for templates and project settings
#   company: "My Company"
#
#   # Additional comments to embed in Info.plist metadata
#   comments: "Some Product Comments"

# Dev mode configuration
dev_mode:
  root_path: .

  # Keep Wails' own dev output relatively quiet.
  log_level: warn

  # Reduced from 1000ms so backend changes are detected faster.
  # 250-400ms is usually a good range for local development.
  debounce: 300

  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin

    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"

    watched_extension:
      - "*.go"

      # These are only relevant for JS/TS files outside the frontend
      # directory, such as files used through //wails:include.
      # The frontend directory itself is excluded above because Vite
      # handles frontend changes through HMR.
      - "*.js"
      - "*.ts"

    git_ignore: true

  executes:
    # Start Vite immediately and let it initialise in parallel with
    # the native Wails/Go build.
    #
    # This avoids waiting for the entire native build before even
    # starting the frontend development server.
    - cmd: wails3 task common:dev:frontend
      type: background

    # Build the native application.
    #
    # IMPORTANT:
    # This still calls your existing platform build tasks underneath
    # `wails3 build DEV=true`.
    #
    # If this currently performs:
    #   - go mod tidy
    #   - npm install
    #   - binding generation
    #   - vite build
    #   - syso generation
    #   - go build
    #
    # those steps must be optimised in build/Taskfile.yml and
    # build/windows/Taskfile.yml. config.yml cannot remove those
    # individual build dependencies by itself.
    - cmd: wails3 build DEV=true
      type: blocking

    # Run the application once the native build has completed.
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
#  - ext: wails
#    name: Wails
#    description: Wails Application File
#    iconName: wailsFileIcon
#    role: Editor
#
#  - ext: jpg
#    name: JPEG
#    description: Image File
#    iconName: jpegFileIcon
#    role: Editor
#    mimeType: image/jpeg # (optional)

# Other data
other:
  - name: My Other Data
